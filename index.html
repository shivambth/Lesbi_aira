<html lang="id">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Aira ❤️ - Our 4-Month Love Story</title>
    <link rel="stylesheet" href="style.css">

<body class="lang-id">

    <div class="floating-bg" id="floatingBg"></div>

    <!-- Top Language & Navigation Bar -->
    <header class="top-nav">
        <div class="brand">For Aira ❤️ (06.07.2026)</div>
        <div class="nav-controls">
            <button id="langToggleBtn" class="nav-btn" onclick="toggleLanguage()">🌐 EN / ID</button>
            <button class="nav-btn music-btn" onclick="toggleMusic()" id="musicBtn">🎵 Play Music</button>
        </div>
    </header>

    <!-- Main Book Container -->
    <main class="book-container">
        <div class="book" id="book">
            <!-- Cover Page -->
            <div class="page cover-page" data-page="0">
                <div class="cover-content">
                    <div class="badge">4 Bulan Cinta Kita</div>
                    <h1>For Aira</h1>
                    <p class="subtitle" data-id="Kisah cinta kita, bab demi bab yang penuh makna." data-en="Our love story, chapter by chapter full of meaning.">Kisah cinta kita, bab demi bab yang penuh makna.</p>
                    <div class="cover-meta">
                        <p><strong>Shivam</strong> & <strong>Aira</strong></p>
                        <p>06 · 07 · 2026 (10:29 PM)</p>
                    </div>
                    <button class="open-book-btn" onclick="openBook()" data-id="Buka Buku Cinta ❤️" data-en="Open Love Book ❤️">Buka Buku Cinta ❤️</button>
                </div>
            </div>

            <!-- Dynamic Pages Container (Generated by JS) -->
            <div id="pagesContainer"></div>

            <!-- Back Cover -->
            <div class="page back-cover-page" data-page="last">
                <div class="cover-content">
                    <h2>Selamanya Bersamamu</h2>
                    <p data-id="Terima kasih sudah menjadi bagian terindah dalam hidupku, Bebyycuu." data-en="Thank you for being the most beautiful part of my life, Bebyycuu.">Terima kasih sudah menjadi bagian terindah dalam hidupku, Bebyycuu.</p>
                    <div class="final-sig">
                        <p>Yours always,</p>
                        <h3>Shivam ❤️ Aira</h3>
                        <h1 class="neon-surprise">LESBICUUUU ❤️</h1>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Book Navigation -->
    <footer class="book-footer">
        <button class="control-btn" onclick="prevPage()" id="prevBtn" data-id="◀ Sebelumnya" data-en="◀ Previous">◀ Sebelumnya</button>
        <div class="page-counter" id="pageCounter">Cover / 160</div>
        <button class="control-btn" onclick="nextPage()" id="nextBtn" data-id="Selanjutnya ▶" data-en="Next ▶">Selanjutnya ▶</button>
    </footer>

    <!-- Audio Element (Soft romantic instrumental synth) -->
